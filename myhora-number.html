<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHora Number</title>
    <script>
        function openHoroscope() {
            const phoneNumber = document.getElementById("phone-number").value;
            const url = `https://www.myhora.com/horoscope/number.aspx?unumber=${phoneNumber}`;
            window.open(url, "_blank");
        }
    </script>
    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fullscreen background with centered container */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #343a40;
            padding: 20px;
        }

        /* Main container styling */
        .container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #007bff;
        }

        .sub-text {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 20px;
            font-size: 1em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.8em;
            }

            .sub-text {
                font-size: 0.85em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.6em;
            }

            .sub-text {
                font-size: 0.8em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MyHora Number</h1>
        <p class="sub-text">หน้านี้ถูกออกแบบมาเพื่อช่วยให้คุณดูดวงจากเบอร์โทรศัพท์ หรือเลขต่างๆ ของคุณผ่านบริการของ
            MyHora</p>
        <form onsubmit="event.preventDefault(); openHoroscope();">
            <input type="text" id="phone-number" placeholder="0XXXXXXXXX" required>
            <button type="submit">Go</button>
        </form>
    </div>
</body>

</html>
