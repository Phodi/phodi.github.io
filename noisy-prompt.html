<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noisy Prompt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for a polished look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Custom range slider styling */
      input[type="range"] {
        accent-color: #6366f1; /* Indigo-500 */
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 font-sans h-screen p-4 md:p-8 flex flex-col"
  >
    <header class="mb-6 text-center shrink-0">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
        Noisy Prompt
      </h1>
      <p class="text-slate-500 mt-2 max-w-2xl mx-auto">
        Randomly injects a chosen character into your prompt + instruction to
        ignore the noise. Adjust the settings below to control what character is
        used and how frequently it appears.
      </p>
    </header>

    <section
      class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 shrink-0 flex flex-col sm:flex-row gap-6 items-center"
    >
      <!-- Noise Character Input -->
      <div class="flex flex-col w-full sm:w-1/3">
        <label
          for="noiseCharInput"
          class="text-sm font-semibold text-slate-700 mb-1"
          >Noise Character</label
        >
        <input
          type="text"
          id="noiseCharInput"
          value="·"
          class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition-shadow text-center text-lg font-mono"
          placeholder="e.g. ·"
        />
      </div>

      <!-- Noise Frequency Slider -->
      <div class="flex flex-col w-full sm:w-2/3">
        <div class="flex justify-between items-center mb-1">
          <label
            for="noiseFreqSlider"
            class="text-sm font-semibold text-slate-700"
            >Noise Frequency</label
          >
          <span
            id="freqDisplay"
            class="text-sm font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md"
            >35%</span
          >
        </div>
        <div class="flex items-center h-[46px]">
          <!-- Match height of input for alignment -->
          <input
            type="range"
            id="noiseFreqSlider"
            min="0"
            max="100"
            value="50"
            class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
          />
        </div>
      </div>
    </section>

    <main class="flex-1 flex flex-col md:flex-row gap-6 min-h-0">
      <!-- Left Side: Input -->
      <div class="flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-2 px-1">
          <label
            for="inputText"
            class="text-lg font-semibold text-slate-700 flex items-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-blue-500"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              ></path>
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              ></path>
            </svg>
            Input
          </label>
          <button
            id="pasteBtn"
            class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-blue-700 bg-blue-100 rounded-md hover:bg-blue-200 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
            <span>Paste</span>
          </button>
        </div>
        <textarea
          id="inputText"
          class="flex-1 w-full p-4 border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none resize-none transition-shadow text-base leading-relaxed bg-white"
          placeholder="Type or paste your prompt here..."
        ></textarea>
      </div>

      <!-- Right Side: Output -->
      <div class="flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-2 px-1">
          <label
            for="outputText"
            class="text-lg font-semibold text-slate-700 flex items-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-green-500"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Output
          </label>
          <button
            id="copyBtn"
            class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-green-700 bg-green-100 rounded-md hover:bg-green-200 transition-colors focus:outline-none focus:ring-2 focus:ring-green-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>
        <textarea
          id="outputText"
          readonly
          class="flex-1 w-full p-4 border border-slate-200 rounded-xl shadow-inner bg-slate-100/75 text-slate-700 focus:outline-none resize-none text-base leading-relaxed cursor-default"
          placeholder="Noisy prompt will appear here..."
        ></textarea>
      </div>
    </main>

    <script>
      // Get DOM elements
      const inputText = document.getElementById("inputText");
      const outputText = document.getElementById("outputText");
      const noiseCharInput = document.getElementById("noiseCharInput");
      const noiseFreqSlider = document.getElementById("noiseFreqSlider");
      const freqDisplay = document.getElementById("freqDisplay");
      const pasteBtn = document.getElementById("pasteBtn");
      const copyBtn = document.getElementById("copyBtn");

      // Debounce utility to prevent UI freezing during rapid typing/rendering
      function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      }

      /**
       * Core transformation function.
       * Iterates through the input text and randomly inserts the noise character
       * based on the provided probability percentage.
       *
       * @param {string} text - The original input text.
       * @param {string} noiseChar - The character(s) to insert.
       * @param {number} frequency - The probability (0-100) of inserting the noise character after each real character.
       * @returns {string} - The transformed noisy text.
       */
      function transformText(text, noiseChar, frequency) {
        if (!text) return "";

        const len = text.length;
        const probability = frequency / 100;
        const result = [];

        // Skip processing if probability is 0
        if (probability === 0) return text;

        for (let i = 0; i < len; i++) {
          const c = text[i];
          result.push(c);

          // Fast checking without regular expressions
          const isCSpace = c === " " || c === "\n" || c === "\t" || c === "\r";
          let isNextSpace = false;

          if (i + 1 < len) {
            const nextC = text[i + 1];
            isNextSpace =
              nextC === " " ||
              nextC === "\n" ||
              nextC === "\t" ||
              nextC === "\r";
          }

          if (!isCSpace && !isNextSpace && Math.random() < probability) {
            result.push(noiseChar);
          }
        }
        instruction_text = `Ignore the '${noiseChar}' characters that appear randomly inside the words and sentences that follow: they are noise picked up in transit, not letters, punctuation or markdown. Read the text as if they were not there.`;
        return instruction_text + "\n\n" + result.join("");
      }

      // Function to process the current state and update output
      function updateOutput() {
        const currentText = inputText.value;
        const currentNoiseChar = noiseCharInput.value;
        const currentFreq = parseInt(noiseFreqSlider.value, 10);

        outputText.value = transformText(
          currentText,
          currentNoiseChar,
          currentFreq,
        );
      }

      // Listen for input changes in the main textarea
      inputText.addEventListener("input", updateOutput);

      // Listen for changes in the noise character input
      noiseCharInput.addEventListener("input", updateOutput);

      // Listen for slider changes, update display value, and trigger text transformation
      noiseFreqSlider.addEventListener("input", function () {
        freqDisplay.textContent = this.value + "%";
        updateOutput();
      });

      // Handle Paste Button Click
      pasteBtn.addEventListener("click", async () => {
        try {
          const text = await navigator.clipboard.readText();
          inputText.value = text;

          // Manually trigger the transformation update
          updateOutput();

          // Visual feedback
          const btnText = pasteBtn.querySelector("span");
          const originalText = btnText.innerText;
          btnText.innerText = "Pasted!";
          pasteBtn.classList.replace("bg-blue-100", "bg-blue-300");

          setTimeout(() => {
            btnText.innerText = originalText;
            pasteBtn.classList.replace("bg-blue-300", "bg-blue-100");
          }, 1500);
        } catch (err) {
          // Fallback / Error state
          const btnText = pasteBtn.querySelector("span");
          btnText.innerText = "Error";
          setTimeout(() => (btnText.innerText = "Paste"), 1500);
        }
      });

      // Handle Copy Button Click
      copyBtn.addEventListener("click", () => {
        if (!outputText.value) return;

        // Select the text field for execCommand
        outputText.select();
        outputText.setSelectionRange(0, 99999); // For mobile devices

        try {
          // Use execCommand to copy (reliable in iframe environments)
          document.execCommand("copy");
          window.getSelection().removeAllRanges();

          // Visual feedback
          const btnText = copyBtn.querySelector("span");
          const originalText = btnText.innerText;
          btnText.innerText = "Copied!";
          copyBtn.classList.replace("bg-green-100", "bg-green-300");

          setTimeout(() => {
            btnText.innerText = originalText;
            copyBtn.classList.replace("bg-green-300", "bg-green-100");
          }, 1500);
        } catch (err) {
          const btnText = copyBtn.querySelector("span");
          btnText.innerText = "Error";
          setTimeout(() => (btnText.innerText = "Copy"), 1500);
        }
      });

      // Initialize empty state logic (ensure output is empty on load)
      updateOutput();
    </script>
  </body>
</html>
